name: Verify SEO branch

on:
  push:
    branches: [main, seo-technical-review]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run game engine tests
        run: npm test
      - name: Build and verify production SEO output
        run: npm run build:production
